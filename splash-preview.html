<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>מסכי פתיחה — בחירה</title>
    <style>
      :root { color: #fbf3e6; font-family: system-ui, "Segoe UI", "Arial Hebrew", sans-serif; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a0e; }
      svg#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #tabs { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2; }
      #tabs button { font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 12px; border: none;
        background: rgba(0,0,0,.45); color: #fff; }
      #tabs button.on { background: #ffb347; color: #2b1a0e; font-weight: 700; }
      .title { font-weight: 900; fill: #ffb347; stroke: #5a2a10; stroke-width: 6px; paint-order: stroke; }
      .tap { fill: #fff; font-size: 20px; animation: pulse 1.2s infinite alternate; }
      @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="tabs">
      <button data-v="0">1 · הכפכף</button>
      <button data-v="1">2 · החור בקיר</button>
      <button data-v="2">3 · הכותרת</button>
    </div>
    <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
    <script type="module">
      import { SPLASHES } from "./src/ui/splashScenes.js";
      const svg = document.querySelector("#scene");
      const buttons = [...document.querySelectorAll("#tabs button")];
      let current = null;
      function show(i) {
        current?.destroy();
        buttons.forEach((b, k) => b.classList.toggle("on", k === i));
        current = SPLASHES[i].create(svg);
        history.replaceState(null, "", `#${i + 1}`);
      }
      buttons.forEach((b, i) => b.addEventListener("click", () => show(i)));
      show(Math.max(0, Math.min(2, Number(location.hash.slice(1)) - 1 || 0)));
    </script>
  </body>
</html>
