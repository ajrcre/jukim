<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1a0e" />
    <meta name="description" content="משחק מחיצת ג'וקים — בעכבר, במגע, או כשהם יוצאים לכם מהפה במצלמה" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>מחץ את הג'וק</title>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="מחץ את הג'וק" />
    <meta property="og:title" content="מחץ את הג'וק 🪳" />
    <meta property="og:description" content="משחק מחיצת ג'וקים — במגע, בקליק, או כשהם יוצאים לכם מהפה במצלמה" />
    <meta property="og:url" content="https://ajrcre.github.io/jukim/" />
    <meta property="og:image" content="https://ajrcre.github.io/jukim/icons/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ג'וקים ריאליסטיים על רצפת אריחים והכותרת מחץ את הג'וק" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="מחץ את הג'וק 🪳" />
    <meta name="twitter:description" content="משחק מחיצת ג'וקים — במגע, בקליק, או כשהם יוצאים לכם מהפה במצלמה" />
    <meta name="twitter:image" content="https://ajrcre.github.io/jukim/icons/og-image.jpg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <video id="bgVideo" playsinline muted hidden></video>
      <canvas id="bg"></canvas>
      <canvas id="game"></canvas>
    </div>

    <div id="hud" hidden>
      <div class="stat"><small>שלב</small><b id="hud-level">1</b></div>
      <div class="stat"><small>ניקוד</small><b id="hud-score">0</b></div>
      <div class="stat"><small>זמן</small><b id="hud-time">30</b></div>
      <div class="progress">
        <div class="bar"><div id="hud-progress"></div></div>
        <small id="hud-count">0/8</small>
      </div>
      <button id="pause-btn" aria-label="הפסקה">⏸</button>
    </div>

    <div id="lobby" hidden>
      <div class="panel lobby">
        <h1>מחץ את הג'וק</h1>

        <h3>מצב משחק</h3>
        <div class="cards" id="mode-cards">
          <button class="card" data-mode="classic">
            <span class="emoji">👆</span>
            <b>קלאסי</b>
            <small>ג'וקים נכנסים מהקצוות — מוחצים בנגיעה או בקליק</small>
          </button>
          <button class="card" data-mode="mouth">
            <span class="emoji">😮</span>
            <b>ג'וקים מהפה</b>
            <small>מצלמה קדמית: פתחו את הפה — והם יוצאים!</small>
          </button>
        </div>

        <h3>רקע</h3>
        <p class="note" id="bg-note" hidden>במצב "ג'וקים מהפה" הרקע הוא המצלמה הקדמית</p>
        <div id="bg-grid"></div>

        <div class="row">
          <label class="switch"><input id="sound-toggle" type="checkbox" checked /> 🔊 צלילים ורטט</label>
          <span class="record" id="lobby-record"></span>
        </div>

        <div class="buttons"><button id="start-btn" class="primary big-btn">▶ יאללה!</button></div>
      </div>
    </div>

    <div id="overlay" hidden><div class="panel"></div></div>

    <div id="splash" hidden>
      <svg id="splash-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <input id="bg-upload" type="file" accept="image/*" hidden />
    <div id="status" hidden></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
